  <script src="https://unpkg.com/lucide@1.52.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--bg:#f7f7f5;--panel:#fff;--panel-2:#f3f4f1;--ink:#151714;--muted:#74776f;--line:#e3e5df;--accent:#216b4d;--accent-2:#e3f2ea;--danger:#b83932;--warn:#a86f11;--shadow:0 14px 42px rgba(20,30,25,.09);--radius:14px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}.app{height:100dvh;display:grid;grid-template-columns:248px minmax(0,1fr)}button,input,select,textarea{font:inherit}button{color:inherit;border:0;background:transparent;cursor:pointer}.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px}.icon-btn:hover,.nav-item:hover{background:var(--panel-2)}.icon-btn:focus-visible,button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent),transparent 60%);outline-offset:2px}.sidebar{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:16px;background:var(--panel)}.brand{height:35px;display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:700;font-size:16px;letter-spacing:-.4px}.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:white;font-size:14px}.compose{background:var(--ink);color:var(--panel);height:42px;border-radius:11px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .16s}.compose:hover{transform:translateY(-1px)}.nav{display:grid;gap:3px;overflow:auto}.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 5px;font-weight:650}.nav-item{width:100%;height:34px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;color:var(--muted)}.nav-item.active{background:var(--accent-2);color:var(--accent);font-weight:650}.nav-item .count{margin-left:auto;font-size:12px}.dot-label{width:9px;height:9px;border-radius:3px}.storage{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0}.storage-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.bar{height:5px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;background:var(--accent);width:36%;height:100%;border-radius:inherit}.main{min-width:0;display:grid;grid-template-rows:66px minmax(0,1fr)}.topbar{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--panel)}.mobile-menu{display:none}.search{max-width:640px;flex:1;display:flex;align-items:center;gap:9px;background:var(--panel-2);height:38px;border-radius:10px;padding:0 12px;color:var(--muted)}.search:focus-within{box-shadow:0 0 0 2px var(--accent)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 4px}.top-actions{display:flex;align-items:center;gap:3px;margin-left:auto}.avatar{width:30px;height:30px;border-radius:50%;background:#ddc79e;color:#513f1d;display:grid;place-items:center;font-weight:700;font-size:12px}.workspace{min-height:0;display:grid;grid-template-columns:minmax(320px, 1fr);background:var(--bg)}.list-pane{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.toolbar{height:55px;padding:0 24px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);background:var(--panel)}.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:4px}.toolbar select{border:0;background:transparent;color:var(--muted);outline:none}.check{width:17px;height:17px;accent-color:var(--accent)}.mail-list{overflow:auto;padding:0 10px 18px}.mail-row{display:grid;grid-template-columns:28px 28px minmax(130px,.65fr) minmax(200px,2fr) auto;gap:8px;align-items:center;min-height:65px;border-bottom:1px solid var(--line);padding:8px 9px;border-radius:9px;cursor:pointer}.mail-row:hover{background:var(--panel)}.mail-row.unread{font-weight:660}.mail-row.selected{background:var(--accent-2)}.star{color:#c6c9c0}.star.on{color:#e6ac39;fill:#e6ac39}.sender{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subject{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{color:var(--muted);font-weight:400}.date{font-size:12px;color:var(--muted);white-space:nowrap}.chips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}.chip{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);font-weight:600}.attach{color:var(--muted)}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.detail{display:none;min-width:0;background:var(--panel);overflow:auto}.detail.open{display:block}.detail-toolbar{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 22px;position:sticky;top:0;background:var(--panel);z-index:2}.message{max-width:800px;margin:0 auto;padding:36px 48px}.message h1{font-size:24px;letter-spacing:-.7px;margin:0 0 26px}.message-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:26px}.sender-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-weight:750}.sender-name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:2px}.message-body{line-height:1.65;color:color-mix(in srgb,var(--ink),var(--muted) 10%);white-space:pre-wrap}.attachment-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:inline-flex;align-items:center;gap:9px;margin:18px 7px 0 0;min-width:174px}.reply-actions{display:flex;gap:8px;margin-top:34px}.outline{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:600}.outline:hover{background:var(--panel-2)}.modal-wrap{position:fixed;inset:0;background:rgba(10,15,11,.28);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal-wrap.show{display:flex}.modal{width:min(700px,100%);max-height:min(760px,92dvh);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.modal-body{padding:20px}.compose-modal{width:min(680px,100%)}.field{display:flex;align-items:center;gap:10px;min-height:43px;border-bottom:1px solid var(--line)}.field label{color:var(--muted);font-size:12px;width:44px}.field input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);min-width:0}.link-btn{font-size:12px;color:var(--accent)}.editor-tools{display:flex;gap:2px;padding:10px;border-bottom:1px solid var(--line)}.editor{min-height:230px;padding:16px 20px;outline:0;line-height:1.55}.compose-foot{border-top:1px solid var(--line);padding:11px 13px;display:flex;align-items:center;gap:5px}.send{padding:9px 15px;border-radius:9px;background:var(--accent);color:white;font-weight:650}.spacer{flex:1}.dropzone{font-size:12px;color:var(--muted);padding:0 20px 9px}.menu{position:fixed;z-index:30;right:22px;top:55px;width:225px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);padding:6px;display:none}.menu.show{display:block}.menu button{width:100%;padding:9px 10px;text-align:left;border-radius:7px}.menu button:hover{background:var(--panel-2)}.settings{display:grid;grid-template-columns:170px 1fr;min-height:470px}.settings-nav{border-right:1px solid var(--line);padding:10px}.settings-nav button{width:100%;padding:9px;text-align:left;border-radius:7px;color:var(--muted)}.settings-nav button.active,.settings-nav button:hover{background:var(--panel-2);color:var(--ink)}.settings-content{padding:10px 24px}.setting-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.setting-row p{margin:3px 0 0;color:var(--muted);font-size:12px}.toggle{appearance:none;width:38px;height:22px;background:var(--line);border-radius:20px;position:relative;transition:.15s}.toggle:checked{background:var(--accent)}.toggle:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:white;top:3px;left:3px;transition:.15s}.toggle:checked:after{left:19px}.command{width:min(620px,100%)}.command input{width:100%;border:0;outline:0;padding:13px 0;color:var(--ink);background:transparent}.command-item{padding:10px;border-radius:8px;display:flex;justify-content:space-between}.command-item:hover{background:var(--panel-2)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);z-index:60;background:var(--ink);color:var(--panel);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);transition:.25s;display:flex;gap:12px;align-items:center}.toast.show{transform:translateX(-50%) translateY(0)}.toast button{color:#98e4be;font-weight:650}.hide{display:none!important}
    @media (min-width:1060px){.workspace.detail-open{grid-template-columns:minmax(420px,.78fr) minmax(480px,1.22fr)}.detail.open{border-left:1px solid var(--line)}.workspace.detail-open .list-pane{min-width:0}.workspace.detail-open .mail-row{grid-template-columns:23px 23px minmax(90px,.8fr) minmax(70px,1.2fr) auto}.workspace.detail-open .preview{display:none}}
    @media (max-width:760px){body{overflow:auto}.app{grid-template-columns:1fr;height:100dvh}.sidebar{display:none;position:fixed;z-index:15;inset:0 58px 0 0;box-shadow:var(--shadow)}.sidebar.open{display:flex}.topbar{padding:0 11px}.mobile-menu{display:grid}.top-actions .help,.top-actions .theme{display:none}.search{max-width:none}.workspace,.workspace.detail-open{display:block}.list-pane{height:calc(100dvh - 66px)}.detail{position:fixed;z-index:10;inset:66px 0 0}.message{padding:24px 18px}.mail-list{padding:0 4px}.mail-row{grid-template-columns:22px minmax(90px,1fr) auto;gap:7px;min-height:68px}.mail-row .row-check,.mail-row .star,.mail-row .attach,.mail-row .preview{display:none}.subject{grid-column:2/3;grid-row:2;align-self:start;font-size:12px}.date{grid-column:3;grid-row:1}.toolbar{padding:0 12px}.toolbar .density{display:none}.settings{grid-template-columns:1fr}.settings-nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.settings-nav button{white-space:nowrap}.settings-content{padding:6px 16px}.modal-wrap{align-items:flex-end;padding:0}.modal{width:100%;max-height:92dvh;border-radius:16px 16px 0 0}.compose-modal{height:92dvh}.kbd{display:none}}
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Mailbox navigation">
    <div class="brand"><span class="mark">M</span> Mac Tidar Mail</div>
    <button class="compose" id="composeBtn"><i data-lucide="pen-line" size="17"></i>Compose</button>
    <nav class="nav" id="nav"></nav>
    <div class="storage"><div class="storage-row"><span>3.6 GB of 10 GB used</span><button class="link-btn" id="storageBtn">Manage</button></div><div class="bar"><i></i></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu"><i data-lucide="menu"></i></button><div class="search"><i data-lucide="search" size="17"></i><input id="search" aria-label="Search mail" placeholder="Search mail"/><span class="kbd">/</span><button class="icon-btn" id="filterBtn" aria-label="Search filters"><i data-lucide="sliders-horizontal" size="16"></i></button></div><div class="top-actions"><button class="icon-btn help" id="shortcutBtn" aria-label="Keyboard shortcuts"><i data-lucide="circle-help" size="18"></i></button><button class="icon-btn theme" id="themeBtn" aria-label="Change theme"><i data-lucide="sun-moon" size="18"></i></button><button class="icon-btn" id="settingsBtn" aria-label="Settings"><i data-lucide="settings-2" size="18"></i></button><button class="avatar" id="profileBtn" aria-label="Account menu">UE</button></div></header>
    <section class="workspace" id="workspace"><div class="list-pane"><div class="toolbar"><input class="check" id="selectAll" type="checkbox" aria-label="Select all"/><button class="icon-btn" id="refreshBtn" aria-label="Refresh"><i data-lucide="refresh-cw" size="17"></i></button><span class="toolbar-selection" id="selectionText"></span><div class="right"><select id="sortSelect" aria-label="Sort messages"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="sender">Sender</option></select><button class="icon-btn density" id="densityBtn" aria-label="Toggle density"><i data-lucide="align-justify" size="17"></i></button></div></div><div class="mail-list" id="mailList" aria-live="polite"></div></div><article class="detail" id="detail" aria-label="Message detail"></article></section>
  </main>
</div>
<div class="modal-wrap" id="modalWrap" aria-hidden="true"></div><div class="menu" id="accountMenu"></div><div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const STORE='mtmail-v1';
  const accounts=[{id:'ukeme@mactidar.com',name:'Ukeme Eseme',initials:'UE'},{id:'admin@mactidar.com',name:'Mac Tidar Admin',initials:'MA'},{id:'hello@mactidar.com',name:'Mac Tidar Hello',initials:'MH'},{id:'support@mactidar.com',name:'Mac Tidar Support',initials:'MS'}];
  const seeds=[
    ['Amara Okafor','amara@studio.works','Brand review: final routes','Hi Ukeme, the revised visual routes are attached. I especially like the quieter system for the mail product — it feels confident without trying too hard.','Design','presentation-v4.pdf'],
    ['GitHub','notifications@github.com','[MacTidar/mail] Fix keyboard navigation focus trap','ukemeskywalker pushed 3 commits to the feature/command-palette branch. Review requested from you.','Engineering',null],
    ['AWS','aws-notification@amazon.com','AWS Billing: October forecast available','Your current projected charges are within the budget alert threshold. This is a demo notification only.','Cloud','cost-explorer.csv'],
    ['Jordan Lee','jordan@framehouse.co','Tuesday product sync','Can we keep the product review to thirty minutes? I have added an outline and the open decisions.','Meetings','agenda.docx'],
    ['Linear','updates@linear.app','You were mentioned in MTM-24','Asha mentioned you in “Define draft recovery behavior”. The issue moved to In progress.','Product',null],
    ['Stripe','invoices@stripe.com','Your October invoice is ready','Your invoice for Mac Tidar AI Venture Studio is now available. Amount due: ₦24,500.','Finance','invoice-october.pdf'],
    ['Nadia Mensah','nadia@northstar.africa','A thoughtful introduction','Ukeme — I enjoyed your note on building useful AI media products. Would love to compare notes next week.','Personal',null],
    ['Figma','notify@figma.com','New comments in Mac Tidar Mail','Amara left 4 comments in “Mail experience / desktop”.','Design',null],
    ['The Browser Company','hello@thebrowser.company','A calmer way to work online','A few ideas for creating focus in your browser. Read when you have a quiet moment.','Newsletter',null],
    ['Security Center','alerts@mactidar.com','New demo sign-in from Lagos','A simulated sign-in to your Mac Tidar account was recorded from Lagos, NG.','Security',null],
    ['Paystack','updates@paystack.com','Product update: dashboard improvements','Your team can now review payout information with a clearer activity timeline.','Finance',null],
    ['Workspace','calendar@mactidar.com','Invitation: Mac Tidar weekly planning','You have been invited to Mac Tidar weekly planning, tomorrow at 10:00 WAT.','Meetings','invite.ics'],
    ['Growth Digest','digest@growthnotes.com','Five ideas worth keeping','A short, editorial collection for people building products with conviction.','Newsletter',null],
    ['Unknown Sender','winner@fast-cash.biz','YOU HAVE WON ₦5,000,000!!!','Urgent action required to release your prize. Send your details now.','Spam',null]
  ];
  const makeData=()=>({accounts:Object.fromEntries(accounts.map((a,ai)=>[a.id,{messages:Array.from({length:70},(_,i)=>{let s=seeds[(i+ai*3)%seeds.length],d=new Date(Date.now()-i*1000*60*60*(i<8?4:18)-ai*10000);return {id:`${ai}-${i}`,thread:i%10===0?`t-${i/10}`:null,from:{name:s[0],email:s[1]},to:[a.id],subject:s[2],body:s[3]+`\n\n— ${s[0].split(' ')[0]}`,date:d.toISOString(),read:i%3!==0,starred:i%13===0,folder:s[4]==='Spam'?'spam':i%19===0?'archive':'inbox',labels:[s[4]],attachments:s[5]?[{name:s[5],size:['1.2 MB','348 KB','2.4 MB'][i%3]}]:[],snoozed:false,kind:'message'};}),labels:[{name:'Design',color:'#9a6bce'},{name:'Engineering',color:'#3b82c4'},{name:'Product',color:'#dc6b8d'},{name:'Finance',color:'#cb9225'},{name:'Personal',color:'#3a9b7d'}],settings:{theme:'system',density:'comfortable',signature:'\n\nUkeme Eseme\nMac Tidar AI Venture Studio',notifications:true}}])),current:'ukeme@mactidar.com'});
  let db; try{db=JSON.parse(localStorage.getItem(STORE))||makeData()}catch{db=makeData()} let ui={folder:'inbox',selected:[],open:null,query:'',sort:'newest',filters:{},settingsTab:'General'}; const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const box=()=>db.accounts[db.current]; const save=()=>localStorage.setItem(STORE,JSON.stringify(db)); const current=()=>accounts.find(a=>a.id===db.current); const icon=(name,size=17)=>`<i data-lucide="${name}" size="${size}"></i>`; const fmt=d=>{let dt=new Date(d),n=new Date();return dt.toDateString()===n.toDateString()?dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):dt.toLocaleDateString([],{month:'short',day:'numeric'})};
  const toast=(text,undo)=>{const el=$('#toast');el.innerHTML=`<span>${esc(text)}</span>${undo?'<button id="undoBtn">Undo</button>':''}`;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),4200);if(undo)$('#undoBtn').onclick=()=>{undo();el.classList.remove('show')}};
  function threadMessages(){let m=box().messages.filter(x=>{if(ui.folder==='inbox')return x.folder==='inbox'&&!x.snoozed;if(ui.folder==='starred')return x.starred&&x.folder!=='trash';if(ui.folder==='snoozed')return x.snoozed;if(ui.folder==='drafts')return x.kind==='draft';if(ui.folder==='scheduled')return x.kind==='scheduled';if(['sent','archive','spam','trash'].includes(ui.folder))return x.folder===ui.folder;if(ui.folder==='unread')return !x.read&&x.folder==='inbox';return x.labels.includes(ui.folder)&&x.folder!=='trash'}).filter(x=>{let q=ui.query.toLowerCase();return !q||[x.from.name,x.from.email,x.subject,x.body,...x.to,...x.labels,...x.attachments.map(a=>a.name)].join(' ').toLowerCase().includes(q)});if(ui.filters.unread)m=m.filter(x=>!x.read);if(ui.filters.attach)m=m.filter(x=>x.attachments.length);if(ui.filters.star)m=m.filter(x=>x.starred);return m.sort((a,b)=>ui.sort==='oldest'?new Date(a.date)-new Date(b.date):ui.sort==='sender'?a.from.name.localeCompare(b.from.name):new Date(b.date)-new Date(a.date))}
  function nav(){let b=box(),unread=b.messages.filter(x=>x.folder==='inbox'&&!x.read).length,items=[['inbox','Inbox',unread,'inbox'],['starred','Starred','','star'],['snoozed','Snoozed','','clock-3'],['sent','Sent','','send'],['drafts','Drafts',b.messages.filter(x=>x.kind==='draft').length,'file-pen-line'],['scheduled','Scheduled',b.messages.filter(x=>x.kind==='scheduled').length,'calendar-clock'],['archive','Archive','','archive'],['spam','Spam','','octagon-alert'],['trash','Trash','','trash-2']];$('#nav').innerHTML=items.map(([id,n,c,i])=>`<button class="nav-item ${ui.folder===id?'active':''}" data-folder="${id}">${icon(i)}<span>${n}</span><span class="count">${c||''}</span></button>`).join('')+'<div class="nav-title">Labels <button class="link-btn" id="newLabel">+ New</button></div>'+b.labels.map(l=>`<button class="nav-item ${ui.folder===l.name?'active':''}" data-folder="${esc(l.name)}"><span class="dot-label" style="background:${l.color}"></span><span>${esc(l.name)}</span></button>`).join('');document.querySelectorAll('[data-folder]').forEach(e=>e.onclick=()=>{ui.folder=e.dataset.folder;ui.selected=[];closeDetail();render()});$('#newLabel').onclick=labelPrompt;}
  function renderList(){let list=threadMessages();$('#mailList').innerHTML=list.length?list.map(m=>`<div class="mail-row ${!m.read?'unread':''} ${ui.selected.includes(m.id)?'selected':''}" data-id="${m.id}"><input class="check row-check" type="checkbox" aria-label="Select ${esc(m.subject)}" ${ui.selected.includes(m.id)?'checked':''}/><button class="star ${m.starred?'on':''}" aria-label="Star" data-star="${m.id}">${icon('star',17)}</button><div class="sender">${esc(m.from.name)}</div><div class="subject">${esc(m.subject)} <span class="preview">— ${esc(m.body.split('\n')[0])}</span>${m.labels.filter(x=>!['Spam','Newsletter'].includes(x)).slice(0,1).map(l=>`<span class="chips"><span class="chip">${esc(l)}</span></span>`).join('')}</div><span class="attach">${m.attachments.length?icon('paperclip',14):''}</span><span class="date">${fmt(m.date)}</span></div>`).join(''):'<div class="empty"><i data-lucide="inbox" size="28"></i><p>Your ${esc(ui.folder)} is clear.</p></div>';$('#mailList').onclick=e=>{let row=e.target.closest('.mail-row');if(!row)return;let id=row.dataset.id;if(e.target.closest('.row-check')){toggleSelect(id);return}if(e.target.closest('[data-star]')){toggleStar(id);return}openMessage(id)}; $('#selectAll').checked=list.length>0&&list.every(m=>ui.selected.includes(m.id));$('#selectionText').textContent=ui.selected.length?`${ui.selected.length} selected`:'';lucide.createIcons();}
  function render(){applyTheme();nav();renderList();renderToolbar();$('#profileBtn').textContent=current().initials;save()}
  function renderToolbar(){let active=ui.selected.length>0;let toolbar=$('.toolbar');let old=toolbar.querySelector('.bulk'); if(old)old.remove();if(active){let el=document.createElement('span');el.className='bulk';el.innerHTML=`<button class="icon-btn" data-bulk="archive" aria-label="Archive">${icon('archive',17)}</button><button class="icon-btn" data-bulk="spam" aria-label="Spam">${icon('octagon-alert',17)}</button><button class="icon-btn" data-bulk="trash" aria-label="Delete">${icon('trash-2',17)}</button><button class="icon-btn" data-bulk="read" aria-label="Mark read">${icon('mail-open',17)}</button>`;toolbar.insertBefore(el,toolbar.querySelector('.right'));el.querySelectorAll('[data-bulk]').forEach(x=>x.onclick=()=>bulk(x.dataset.bulk));lucide.createIcons()}}
  const get=id=>box().messages.find(m=>m.id===id); function toggleSelect(id){ui.selected=ui.selected.includes(id)?ui.selected.filter(x=>x!==id):[...ui.selected,id];renderList();renderToolbar()} function toggleStar(id){let m=get(id);m.starred=!m.starred;render();toast(m.starred?'Starred':'Star removed')} function openMessage(id){let m=get(id);m.read=true;ui.open=id;let replies=box().messages.filter(x=>x.thread&&x.thread===m.thread);let related=[m,...replies.filter(x=>x.id!==m.id)];$('#detail').innerHTML=`<div class="detail-toolbar"><button class="icon-btn" id="backBtn" aria-label="Back to inbox">${icon('arrow-left')}</button><button class="icon-btn" data-detail="archive" aria-label="Archive">${icon('archive')}</button><button class="icon-btn" data-detail="spam" aria-label="Report spam">${icon('octagon-alert')}</button><button class="icon-btn" data-detail="trash" aria-label="Delete">${icon('trash-2')}</button><span class="spacer"></span><button class="icon-btn" id="printBtn" aria-label="Print message">${icon('printer')}</button></div><div class="message"><h1>${esc(m.subject)}</h1>${related.map((x,idx)=>`<section class="message-part"><div class="message-head"><div class="sender-avatar">${esc(x.from.name.split(' ').map(n=>n[0]).join('').slice(0,2))}</div><div><div class="sender-name">${esc(x.from.name)} <span class="meta">&lt;${esc(x.from.email)}&gt;</span></div><div class="meta">to ${esc(x.to.join(', '))} · ${new Date(x.date).toLocaleString()}</div></div></div><div class="message-body">${esc(x.body)}</div>${x.attachments.map(a=>`<div class="attachment-card">${icon('file-text')}<span><b>${esc(a.name)}</b><br><small>${a.size}</small></span></div>`).join('')}${idx<related.length-1?'<hr style="border:0;border-top:1px solid var(--line);margin:28px 0">':''}</section>`).join('')}<div class="reply-actions"><button class="outline" id="replyBtn">${icon('reply',15)} Reply</button><button class="outline" id="forwardBtn">${icon('forward',15)} Forward</button></div></div>`;$('#detail').classList.add('open');$('#workspace').classList.add('detail-open');$('#backBtn').onclick=closeDetail;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{move([m.id],b.dataset.detail)});$('#replyBtn').onclick=()=>compose({to:m.from.email,subject:`Re: ${m.subject}`,body:`\n\nOn ${new Date(m.date).toLocaleDateString()}, ${m.from.name} wrote:\n${m.body}`});$('#forwardBtn').onclick=()=>compose({subject:`Fwd: ${m.subject}`,body:`\n\n---------- Forwarded message ----------\nFrom: ${m.from.name}\n\n${m.body}`});$('#printBtn').onclick=()=>window.print();render();lucide.createIcons()}
  function closeDetail(){ui.open=null;$('#detail').classList.remove('open');$('#workspace').classList.remove('detail-open')} function move(ids,target){let changed=ids.map(get).filter(Boolean);let prev=changed.map(m=>({id:m.id,folder:m.folder,snoozed:m.snoozed}));changed.forEach(m=>{m.snoozed=false;m.folder=target});ui.selected=[];if(ui.open&&ids.includes(ui.open))closeDetail();render();toast(target==='trash'?'Conversation moved to Trash':target==='spam'?'Reported as spam':`Moved to ${target}`,()=>{prev.forEach(p=>{let m=get(p.id);Object.assign(m,p)});render()})} function bulk(action){if(action==='read'){ui.selected.forEach(id=>get(id).read=true);render();toast('Marked as read');return}move(ui.selected,action)}
  function compose(prefill={}){let attachments=[];showModal(`<div class="modal compose-modal"><div class="modal-head"><b>New message</b><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="field"><label>To</label><input id="cTo" value="${esc(prefill.to||'')}" placeholder="name@mactidar.com"/><button class="link-btn" id="ccBtn">Cc Bcc</button></div><div class="field hide" id="ccRow"><label>Cc</label><input id="cCc" placeholder="Optional"/></div><div class="field"><label>Subject</label><input id="cSubject" value="${esc(prefill.subject||'')}" placeholder="Subject"/></div><div class="editor-tools"><button class="icon-btn" data-format="bold" aria-label="Bold"><b>B</b></button><button class="icon-btn" data-format="italic" aria-label="Italic"><i>I</i></button><button class="icon-btn" data-format="underline" aria-label="Underline"><u>U</u></button><button class="icon-btn" data-format="insertUnorderedList" aria-label="List">${icon('list')}</button><button class="icon-btn" id="linkFormat" aria-label="Link">${icon('link')}</button></div><div id="cBody" class="editor" contenteditable="true" role="textbox" aria-multiline="true">${esc(prefill.body||'')}</div><div class="dropzone" id="dropzone">Drop files here or use the attachment button. Demo limit: 10 MB per file.</div><div class="compose-foot"><button class="send" id="sendBtn">Send</button><button class="icon-btn" id="attachBtn" aria-label="Attach files">${icon('paperclip')}</button><input id="fileInput" type="file" multiple class="hide"/><button class="icon-btn" id="scheduleBtn" aria-label="Schedule send">${icon('calendar-clock')}</button><span class="spacer"></span><button class="icon-btn" id="discardBtn" aria-label="Discard draft">${icon('trash-2')}</button></div></div>`);const body=$('#cBody'),setAttach=fs=>{attachments=[...attachments,...[...fs].filter(f=>f.size<=10*1024*1024).map(f=>({name:f.name,size:(f.size/1024/1024).toFixed(1)+' MB'}))];$('#dropzone').textContent=attachments.length?attachments.map(x=>x.name).join(', '):'Drop files here or use the attachment button. Demo limit: 10 MB per file.'};$('#ccBtn').onclick=()=>$('#ccRow').classList.toggle('hide');document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>document.execCommand(b.dataset.format,false));$('#linkFormat').onclick=()=>{let u=prompt('Link URL');if(u)document.execCommand('createLink',false,u)};$('#attachBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>setAttach(e.target.files);$('#dropzone').ondragover=e=>e.preventDefault();$('#dropzone').ondrop=e=>{e.preventDefault();setAttach(e.dataTransfer.files)};let deliver=scheduled=>{let to=$('#cTo').value.trim().split(',').map(x=>x.trim()).filter(Boolean),subject=$('#cSubject').value.trim(),text=body.innerText.trim();if(!to.length||to.some(x=>!/^\S+@\S+\.\S+$/.test(x))){toast('Enter a valid recipient email address');$('#cTo').focus();return}if(!subject){toast('Add a subject before sending');$('#cSubject').focus();return}let m={id:'local-'+Date.now(),thread:null,from:{name:current().name,email:db.current},to,subject,body:text||'(No message body)',date:new Date().toISOString(),read:true,starred:false,folder:scheduled?'scheduled':'sent',labels:[],attachments,kind:scheduled?'scheduled':'message',scheduledAt:scheduled?new Date(Date.now()+60000).toISOString():null};box().messages.unshift(m);save();hideModal();render();toast(scheduled?'Scheduled for one minute from now':'Message sent — demo only')};$('#sendBtn').onclick=()=>deliver(false);$('#scheduleBtn').onclick=()=>deliver(true);$('#discardBtn').onclick=()=>{hideModal();toast('Draft discarded')};}
  function showModal(html){$('#modalWrap').innerHTML=html;$('#modalWrap').classList.add('show');$('#modalWrap').setAttribute('aria-hidden','false');$('#modalWrap').onclick=e=>{if(e.target===$('#modalWrap')||e.target.closest('[data-close]'))hideModal()};lucide.createIcons()}function hideModal(){$('#modalWrap').classList.remove('show');$('#modalWrap').setAttribute('aria-hidden','true')}
  function settings(){let tabs=['General','Appearance','Accounts','Signatures','Notifications','Inbox preferences','Keyboard shortcuts','Privacy & security','Storage','About'];let content={General:`<div class="setting-row"><div><b>Reset demo workspace</b><p>Restore the original demo mail, settings and labels for this account.</p></div><button class="outline" id="resetBtn">Reset demo</button></div><div class="setting-row"><div><b>Conversation view</b><p>Group related messages when a conversation is opened.</p></div><input class="toggle" type="checkbox" checked></div>`,Appearance:`<div class="setting-row"><div><b>Theme</b><p>Choose how Mac Tidar Mail looks.</p></div><select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="setting-row"><div><b>Inbox density</b><p>Choose comfortable or compact message rows.</p></div><select id="densitySelect"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div>`,Accounts:`<div class="setting-row"><div><b>${esc(current().name)}</b><p>${esc(db.current)} · Local demo account</p></div><button class="outline" id="switchAccount">Switch</button></div><div class="setting-row"><div><b>Demo environment</b><p>Authentication is simulated locally. No real credentials or emails are used.</p></div></div>`,Signatures:`<label><b>Default signature</b><p class="meta">Added to new messages in the future API-backed implementation.</p></label><textarea id="signature" style="width:100%;height:130px;margin-top:14px;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--ink)">${esc(box().settings.signature)}</textarea>`,Notifications:`<div class="setting-row"><div><b>Desktop notifications</b><p>Show demo alerts for mail activity in this browser.</p></div><input class="toggle" id="notifyToggle" type="checkbox" ${box().settings.notifications?'checked':''}></div>`, 'Inbox preferences':`<div class="setting-row"><div><b>Unread first</b><p>Move unread conversations above read messages.</p></div><input class="toggle" type="checkbox"></div><div class="setting-row"><div><b>Quick actions</b><p>Reveal archive, delete and snooze actions on hover.</p></div><input class="toggle" type="checkbox" checked></div>`, 'Keyboard shortcuts':shortcutContent(), 'Privacy & security':`<div class="setting-row"><div><b>External images</b><p>Images are blocked in this offline demo environment.</p></div><input class="toggle" type="checkbox"></div><div class="setting-row"><div><b>Session</b><p>Your simulated sign-in is stored only in this browser.</p></div><button class="outline" id="logoutBtn">Log out</button></div>`,Storage:`<div class="setting-row"><div><b>3.6 GB of 10 GB used</b><p>Storage figures are representative demo data.</p></div><button class="outline" id="emptyTrash">Empty Trash</button></div>`,About:`<h3>Mac Tidar Mail</h3><p class="meta">A private interactive prototype for the Mac Tidar Suite.</p><p>This is a demo. No message is delivered externally and no production mail service is connected.</p>`};showModal(`<div class="modal"><div class="modal-head"><b>Settings</b><button class="icon-btn" data-close>${icon('x')}</button></div><div class="settings"><div class="settings-nav">${tabs.map(t=>`<button data-tab="${t}" class="${ui.settingsTab===t?'active':''}">${t}</button>`).join('')}</div><div class="settings-content" id="settingsContent">${content[ui.settingsTab]}</div></div></div>`);document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{ui.settingsTab=x.dataset.tab;settings()});if($('#themeSelect')){$('#themeSelect').value=box().settings.theme;$('#themeSelect').onchange=e=>{box().settings.theme=e.target.value;render()};$('#densitySelect').value=box().settings.density;$('#densitySelect').onchange=e=>{box().settings.density=e.target.value;render()}}if($('#signature'))$('#signature').oninput=e=>{box().settings.signature=e.target.value;save()};if($('#notifyToggle'))$('#notifyToggle').onchange=e=>{box().settings.notifications=e.target.checked;save()};if($('#resetBtn'))$('#resetBtn').onclick=()=>{if(confirm('Reset this demo account?')){db.accounts[db.current]=makeData().accounts[db.current];save();hideModal();render();toast('Demo data reset')}};if($('#switchAccount'))$('#switchAccount').onclick=()=>{hideModal();accountMenu()};if($('#logoutBtn'))$('#logoutBtn').onclick=()=>{hideModal();toast('Signed out of the local demo')};if($('#emptyTrash'))$('#emptyTrash').onclick=()=>{box().messages=box().messages.filter(m=>m.folder!=='trash');save();hideModal();render();toast('Trash emptied')}}
  const shortcutContent=()=>`<h3>Keyboard shortcuts</h3><div class="setting-row"><div><b>c</b><p>Compose a message</p></div><span class="kbd">c</span></div><div class="setting-row"><div><b>/</b><p>Focus search</p></div><span class="kbd">/</span></div><div class="setting-row"><div><b>j / k</b><p>Next / previous conversation</p></div><span class="kbd">j k</span></div><div class="setting-row"><div><b>e</b><p>Archive selected or open message</p></div><span class="kbd">e</span></div><div class="setting-row"><div><b>?</b><p>Open this shortcut reference</p></div><span class="kbd">?</span></div>`;
  function labelPrompt(){let n=prompt('Label name');if(!n?.trim())return;if(box().labels.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return toast('That label already exists');box().labels.push({name:n.trim(),color:'#5f8ddd'});render();toast('Label created')}
  function accountMenu(){let m=$('#accountMenu');m.innerHTML=`<div style="padding:9px 10px;color:var(--muted);font-size:12px">Mac Tidar Account</div>${accounts.map(a=>`<button data-account="${a.id}"><span class="avatar" style="display:inline-grid;margin-right:8px">${a.initials}</span>${esc(a.name)}${a.id===db.current?' ✓':''}<br><small style="margin-left:39px;color:var(--muted)">${a.id}</small></button>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><button id="manageProfile">Manage profile</button>`;m.classList.add('show');m.querySelectorAll('[data-account]').forEach(x=>x.onclick=()=>{db.current=x.dataset.account;ui={folder:'inbox',selected:[],open:null,query:'',sort:'newest',filters:{},settingsTab:'General'};m.classList.remove('show');render();toast(`Switched to ${current().name}`)});$('#manageProfile').onclick=()=>{m.classList.remove('show');settings()}}
  function command(){let opts=[['Compose','Create a new message',()=>compose()],['Inbox','Open your inbox',()=>{ui.folder='inbox';render()}],['Search unread mail','Show unread messages',()=>{ui.filters.unread=true;render()}],['Settings','Configure Mac Tidar Mail',settings],['Keyboard shortcuts','See available shortcuts',()=>{ui.settingsTab='Keyboard shortcuts';settings()}]];showModal(`<div class="modal command"><div class="modal-body"><div class="search"><i data-lucide="command"></i><input id="commandInput" placeholder="Type a command…" autofocus></div><div id="commands" style="margin-top:10px">${opts.map((o,i)=>`<button class="command-item" data-command="${i}"><span><b>${o[0]}</b><br><small style="color:var(--muted)">${o[1]}</small></span><span class="kbd">${i===0?'c':''}</span></button>`).join('')}</div></div></div>`);document.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>{hideModal();opts[+x.dataset.command][2]()});$('#commandInput').oninput=e=>document.querySelectorAll('[data-command]').forEach((x,i)=>x.classList.toggle('hide',!opts[i][0].toLowerCase().includes(e.target.value.toLowerCase())))}
  function applyTheme(){let t=box().settings.theme;let actual=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=actual;document.documentElement.style.setProperty('--row-height',box().settings.density==='compact'?'48px':'65px');document.querySelectorAll('.mail-row').forEach(x=>x.style.minHeight=box().settings.density==='compact'?'48px':'65px')}
  $('#composeBtn').onclick=()=>compose();$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{let ss=box().settings;ss.theme=ss.theme==='dark'?'light':'dark';render()};$('#settingsBtn').onclick=settings;$('#profileBtn').onclick=accountMenu;$('#shortcutBtn').onclick=()=>{ui.settingsTab='Keyboard shortcuts';settings()};$('#storageBtn').onclick=()=>{ui.settingsTab='Storage';settings()};$('#refreshBtn').onclick=()=>{toast('Mail is up to date');$('#refreshBtn').querySelector('svg').style.transform='rotate(360deg)';setTimeout(()=>$('#refreshBtn').querySelector('svg').style.transform='',350)};$('#densityBtn').onclick=()=>{box().settings.density=box().settings.density==='comfortable'?'compact':'comfortable';render();toast(`Switched to ${box().settings.density} density`)};$('#search').oninput=e=>{ui.query=e.target.value;renderList()};$('#sortSelect').onchange=e=>{ui.sort=e.target.value;renderList()};$('#selectAll').onchange=e=>{ui.selected=e.target.checked?threadMessages().map(m=>m.id):[];renderList();renderToolbar()};$('#filterBtn').onclick=()=>{let m=$('#accountMenu');m.style.top='57px';m.style.right='100px';m.innerHTML=`<div style="padding:8px"><b>Search filters</b><button data-filter="unread">${ui.filters.unread?'✓ ':''}Unread</button><button data-filter="star">${ui.filters.star?'✓ ':''}Starred</button><button data-filter="attach">${ui.filters.attach?'✓ ':''}Has attachment</button><button id="clearFilters">Clear filters</button></div>`;m.classList.add('show');m.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{let k=b.dataset.filter;ui.filters[k]=!ui.filters[k];m.classList.remove('show');renderList()});$('#clearFilters').onclick=()=>{ui.filters={};m.classList.remove('show');renderList()}};document.addEventListener('click',e=>{if(!e.target.closest('#accountMenu')&&!e.target.closest('#profileBtn')&&!e.target.closest('#filterBtn'))$('#accountMenu').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideModal();closeDetail();return}let tag=document.activeElement.tagName;if(['INPUT','TEXTAREA'].includes(tag)||document.activeElement.isContentEditable)return;if(e.key==='c'){e.preventDefault();compose()}if(e.key==='/'){e.preventDefault();$('#search').focus()}if(e.key==='?'){ui.settingsTab='Keyboard shortcuts';settings()}if(e.key==='e'){let ids=ui.selected.length?ui.selected:ui.open?[ui.open]:[];if(ids.length)move(ids,'archive')}if(e.key==='j'||e.key==='k'){let l=threadMessages(),i=l.findIndex(m=>m.id===ui.open),n=l[e.key==='j'?Math.min(i+1,l.length-1):Math.max(i-1,0)];if(n)openMessage(n.id)}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command()}});setInterval(()=>{let due=box().messages.filter(m=>m.kind==='scheduled'&&new Date(m.scheduledAt)<=new Date());if(due.length){due.forEach(m=>{m.kind='message';m.folder='sent';m.date=new Date().toISOString()});save();render();toast(`${due.length} scheduled message sent — demo only`)}},10000);render();let authMode=new URLSearchParams(location.search).get('mode');if(authMode){showModal(`<div class="modal" style="max-width:440px"><div class="modal-head"><b>Mac Tidar Account</b><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="modal-body"><div class="sender-avatar" style="margin-bottom:15px">M</div><h2 style="margin:0;font-size:25px">${authMode==='signup'?'Create your demo account':'Welcome back'}</h2><p style="color:var(--muted);line-height:1.55">${authMode==='signup'?'Choose one of the local demo accounts to begin exploring Mac Tidar Mail.':'Select a local demo account to continue. No password is collected or stored.'}</p><div style="display:grid;gap:8px;margin-top:20px">${accounts.slice(0,3).map(a=>`<button class="outline" data-auth-account="${a.id}" style="text-align:left">${a.name}<br><small style="color:var(--muted)">${a.id}</small></button>`).join('')}</div></div></div>`);document.querySelectorAll('[data-auth-account]').forEach(x=>x.onclick=()=>{db.current=x.dataset.authAccount;save();hideModal();render();history.replaceState({},'',location.pathname);toast(`Signed in to the local demo as ${current().name}`)})};lucide.createIcons();
})();
